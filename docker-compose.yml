services:
  postgres:
    image: postgres:16-alpine
    container_name: pinterest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinterest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinterest_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pinterest_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinterest_user} -d ${POSTGRES_DB:-pinterest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: pinterest_postgres_data
    driver: local
